<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Sign Up – Gigga</title>
  <meta name="description" content="Register your business on Gigga and start posting side-jobs for students." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <script>
    if (window.location.protocol === 'file:') {
      document.write('<div style="background:#dc2626; color:white; padding:12px; text-align:center; font-family:sans-serif; font-size:14px; font-weight:bold; position:fixed; top:0; left:0; right:0; z-index:9999;">⚠️ Warning: This website uses ES Modules and database features which are blocked when opened directly via file://. Please run the project on a local web server (like VS Code Live Server) to use the site.</div>');
      document.body.style.paddingTop = '50px';
    }
  </script>

  <a href="index.html" class="auth-back">← Back to Gigga</a>

  <button class="dark-mode-toggle" id="darkModeToggle" style="position: fixed; top: 20px; right: 20px; z-index: 1000;" aria-label="Toggle dark mode">🌙</button>

  <div class="auth-container">
    <div class="auth-card wide">
      <div class="auth-logo">
        <span class="logo-icon">G</span>
        <span>Gigga</span>
      </div>
      <div class="role-badge business-badge">💼 Business Registration</div>
      <h1>Post Your First Job</h1>
      <p class="auth-sub">Connect with talented students in your area</p>

      <div id="authMsg" class="auth-msg hidden"></div>

      <form id="registerBusinessForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="bizName">Business / Company Name</label>
          <input type="text" id="bizName" placeholder="Acme Studio" required />
        </div>
        <div class="form-group">
          <label for="bizEmail">Business Email</label>
          <input type="email" id="bizEmail" placeholder="contact@yourbusiness.co.za" required />
        </div>
        <div class="form-group">
          <label for="bizPassword">Password</label>
          <div class="input-wrap">
            <input type="password" id="bizPassword" placeholder="Min 8 characters" required />
            <button type="button" class="toggle-pw" id="toggleBizPw" aria-label="Toggle password">👁</button>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="bizPhone">Phone Number</label>
            <input type="tel" id="bizPhone" placeholder="+27 21 000 0000" />
          </div>
          <div class="form-group">
            <label for="bizCity">City</label>
            <input type="text" id="bizCity" placeholder="Cape Town" />
          </div>
        </div>
        <div class="form-group">
          <label for="bizIndustry">Industry</label>
          <select id="bizIndustry">
            <option value="">Select industry...</option>
            <option>Technology</option>
            <option>Marketing & Media</option>
            <option>Retail & Sales</option>
            <option>Food & Hospitality</option>
            <option>Events & Entertainment</option>
            <option>Education</option>
            <option>Healthcare</option>
            <option>Finance</option>
            <option>Creative Arts & Design</option>
            <option>Logistics & Delivery</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="bizDesc">About Your Business</label>
          <textarea id="bizDesc" rows="3" placeholder="Tell students what you do and what kind of help you're looking for..."></textarea>
        </div>
        <div class="avatar-upload-wrap">
          <div class="avatar-preview square" id="logoPreview">
            <span>Logo</span>
          </div>
          <div class="avatar-upload-info">
            <label for="logoInput" class="btn-outline-sm">Upload Logo</label>
            <input type="file" id="logoInput" accept="image/*" hidden />
            <small>Optional – JPG, PNG – Max 5MB</small>
          </div>
        </div>
        <button type="submit" class="btn-primary full" id="bizRegisterBtn">Create Business Account →</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <button type="button" class="btn-google full" id="googleBizBtn">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.93 5.482 18 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.96H.957C.347 6.173 0 7.549 0 9s.347 2.827.957 4.04l3.007-2.333z" fill="#FBBC05"/>
          <path d="M9 3.58c1.32 0 2.505.453 3.44 1.348l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.07 1.043 5.04l3.007 2.332C4.756 5.164 6.74 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Sign Up with Google
      </button>

      <div class="auth-divider"><span>Already registered?</span></div>
      <a href="login.html" class="btn-ghost full">Log In</a>
    </div>
  </div>

  <script type="module" src="register-business.js"></script>
</body>
</html>
